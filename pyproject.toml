[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offgrid-multi-gfm"
version = "0.1.0"
description = "Off-grid parallel grid-forming PCS simulation workbench"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "plotly", "streamlit>=1.57"]

[project.scripts]
offgrid-gfm = "offgrid_gfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"
